[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcuhome-build-server"
version = "0.1.0.dev0"
description = "Headless MCUHome build service: drives build environments over the session build protocol."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["mcuhome", "zephyr", "matter", "build-server", "home-assistant"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

# `mcuhome-model` is the one MCUHome dependency this server has, and the
# only one it may ever have (ADR 0020 decision 4): the shared vocabulary
# — the context format and the frozen context-ID rule of ADR 0018 §6,
# which ADR 0019 §8 obliges this side to recompute from received bytes.
# That rule is frozen precisely so both sides of the contract compute
# the same value, so it must be one implementation shared, never two
# that agree by inspection. The distribution exists since the E35
# migration; it is dependency-free by construction (a property its own
# packaging tests pin), so this line pulls in exactly the vocabulary and
# nothing behind it. Not on PyPI while the repositories are private —
# requirements-dev.txt installs it from the sibling checkout.
dependencies = ["aiohttp>=3.10,<4", "mcuhome-model"]
#
# There is deliberately **no dependency on `mcuhome-dashboard`**. The two
# are separate products with separate version numbers (ADR 0003 decision
# 1), joined by one protocol; a build server that could not be deployed
# without the dashboard package would make that untrue in the packaging
# even where it is true in the code.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.1", "ruff==0.16.1"]

[project.scripts]
mcuhome-build-server = "mcuhome_buildserver.server:main"

[project.urls]
Homepage = "https://github.com/mcu-home/build-server"
Issues = "https://github.com/mcu-home/build-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcuhome_buildserver"]

# Byte-identical to the dashboard repository's ruff configuration, so
# that `ruff` means the same thing in every MCUHome Python package.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mcuhome_buildserver", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource"
