#
# CI for the MCUHome build server. Two gates:
#
#   lint — ruff (check + format) and REUSE, pinned to the same versions
#          the other MCUHome repositories use; bump them together.
#   test — pytest over the transport, the token and the session protocol.
#
# The test gate needs no sibling repository. It used to check out
# `mcu-home/mcuhome` and `mcu-home/cli` with their own read-only deploy
# keys, because the build server spawned the `mcuhome` command as its
# builder and one test ran the real `mcuhome build --help`; both went
# with the job protocol, so the checkouts, the installs and the
# MCUHOME_DEPLOY_KEY / CLI_DEPLOY_KEY secrets are no longer used here.
# The secrets can be revoked on the respective repositories.
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml,
# which keeps the pins current via its github-actions ecosystem entry).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + REUSE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.1 reuse==5.0.2

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: REUSE lint
        run: reuse lint

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pyproject declares mcuhome-model (ADR 0020 decision 4), which is
      # not on an index while the repositories are private — so the
      # sibling checkout satisfies the declaration, exactly as
      # requirements-dev.txt does on a developer machine. Read-only
      # deploy key; the checkout becomes unnecessary the day the
      # distribution is published.
      - name: Checkout the mcuhome library family
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome
          ssh-key: ${{ secrets.MCUHOME_DEPLOY_KEY }}
          path: .deps/mcuhome

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ./.deps/mcuhome/packaging/model
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: pytest
        run: pytest
