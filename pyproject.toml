[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcuhome-build-server"
version = "0.1.0.dev0"
description = "Headless MCUHome build service: drives build environments over the session build protocol."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["mcuhome", "zephyr", "matter", "build-server", "home-assistant"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

# `mcuhome-workbench` is the MCUHome dependency this server has, and it
# is a reversal: the rule used to be `mcuhome-model` and nothing else,
# so that a build server "recomputes a context ID from bytes it received
# off a socket and carries no build logic to do it". The rule outlived
# the arrangement it protected. This server no longer orchestrates
# anything: a session's build environment is the workbench's — the same
# object a local build gets — and the alternative to depending on it was
# a second implementation of the whole driving half of the build
# contract, which is what there was, and which two green suites could
# not keep in step.
#
# What has **not** reversed is the other edge. `mcuhome-compiler` is the
# program that runs *inside* a build container; a build server that
# imported it would carry a toolchain it exists to keep at arm's length,
# and the container it drives would stop being the only thing that
# compiles. The workbench reaches the compiler only through a dynamic
# import for the build methods that need one, so nothing here loads it —
# and `tests/test_freeze.py` pins both halves of that sentence, in the
# syntax tree and at run time.
#
# `mcuhome-model` comes along behind the workbench and is still what the
# frozen context-ID rule of ADR 0018 §6 lives in — one implementation
# shared, never two that agree by inspection.
#
# `ruamel.yaml` and `zstandard` are this server's own. `context.yaml`
# arrives as YAML and `manifest.yaml` is written as YAML, so a parser
# and an emitter are needed here; `zstandard` is the transport, because
# the context archive is tar.zst (E41) and the streaming decompressor is
# what lets an ingress cap refuse a decompression bomb mid-stream
# instead of after it has landed.
dependencies = [
  "aiohttp>=3.10,<4",
  "mcuhome-workbench",
  "ruamel.yaml>=0.18",
  "zstandard>=0.22",
]
#
# There is deliberately **no dependency on `mcuhome-dashboard`**. The two
# are separate products with separate version numbers (ADR 0003 decision
# 1), joined by one protocol; a build server that could not be deployed
# without the dashboard package would make that untrue in the packaging
# even where it is true in the code.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.1", "ruff==0.16.1"]

[project.scripts]
mcuhome-build-server = "mcuhome_buildserver.server:main"

[project.urls]
Homepage = "https://github.com/mcu-home/build-server"
Issues = "https://github.com/mcu-home/build-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcuhome_buildserver"]

# Byte-identical to the dashboard repository's ruff configuration, so
# that `ruff` means the same thing in every MCUHome Python package.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mcuhome_buildserver", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource"
