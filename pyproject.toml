[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcuhome-build-server"
version = "0.1.0.dev0"
description = "Headless MCUHome build service: drives build environments over the session build protocol."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["mcuhome", "zephyr", "matter", "build-server", "home-assistant"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

dependencies = ["aiohttp>=3.10,<4"]

# This package has no MCUHome dependency at all today, and that is a
# state to leave rather than a state to keep. The old one was a
# non-dependency by design — the `mcuhome` CLI was *spawned*, not
# imported, and only its version constants were read — and it went with
# the job protocol and the builder subprocess.
#
# What replaces it is a real, declarable dependency that does not exist
# yet: ADR 0020 decision 1 splits the lib into `mcuhome-model`,
# `mcuhome-workbench` and `mcuhome-compiler`, and this server consumes
# **`mcuhome-model`** — for the context format and the frozen context-ID
# rule of ADR 0018 §6, which ADR 0019 §8 obliges this side to recompute
# from the received bytes. That rule is frozen precisely so that both
# sides of the contract compute the same value, so it must be one
# implementation shared, never two that agree by inspection. Declare it
# here when the distribution exists and the context path needs it.
#
# There is deliberately **no dependency on `mcuhome-dashboard`**. The two
# are separate products with separate version numbers (ADR 0003 decision
# 1), joined by one protocol; a build server that could not be deployed
# without the dashboard package would make that untrue in the packaging
# even where it is true in the code.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.1", "ruff==0.16.1"]

[project.scripts]
mcuhome-build-server = "mcuhome_buildserver.server:main"

[project.urls]
Homepage = "https://github.com/mcu-home/build-server"
Issues = "https://github.com/mcu-home/build-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcuhome_buildserver"]

# Byte-identical to the dashboard repository's ruff configuration, so
# that `ruff` means the same thing in every MCUHome Python package.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mcuhome_buildserver", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource"
