#
# CI for the MCUHome build server. Three gates:
#
#   lint — ruff (check + format) and REUSE, pinned to the same versions
#          the other MCUHome repositories use; bump them together.
#   test — pytest over the transport, the token and the session protocol.
#   e2e  — one real remote build: this server as a process, a real build
#          container, `mcuhome device build --build-mode remote` against
#          it, and a signed image at the end. The unit suite fakes docker
#          — correctly, a build server is an orchestrator — and that is
#          exactly why three lease-versus-time defects and one address
#          parsed as a URL reached a real build before anything noticed.
#          tests/e2e/run.py is the harness and its head comment is the reason.
#
# The test gate checks out two siblings, `mcu-home/mcuhome-workbench` and
# `mcu-home/mcuhome-sdk`: pyproject declares mcuhome-workbench, which
# brings mcuhome-model with it, and neither is published yet — so the
# sibling checkouts satisfy the declaration. Plain checkouts, no deploy
# key needed since the repositories went public (ADR 0024).
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml,
# which keeps the pins current via its github-actions ecosystem entry).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.1

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .


  test-pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pyproject declares mcuhome-workbench, which brings mcuhome-model
      # with it. Neither is published yet — so the sibling checkouts
      # satisfy the declaration, exactly as requirements-dev.txt does on
      # a developer machine. They become unnecessary the day the
      # distributions are published.
      - name: Checkout mcuhome-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout mcuhome-workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ./.deps/mcuhome-sdk/packaging/model
          python -m pip install --disable-pip-version-check ./.deps/mcuhome-workbench
          python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: pytest
        run: pytest

  # ------------------------------------------------------------------
  # The whole chain, once, for real.
  #
  # Four repositories meet here because a remote build needs all four:
  # the command (mcu-home/mcuhome-cli), the client half of the session protocol
  # and the signing step (mcu-home/mcuhome-workbench), the SDK package and the
  # build container (mcu-home/mcuhome-sdk), and this server. They are
  # checked out at `main` and this repository at the commit under test —
  # which is the arrangement the product owner chose over a shared
  # workflow the other three would call: what is being tested here is
  # building a firmware *through this server*. When the workbench and the
  # compiler grow their own end-to-end job for the local methods, the
  # method will stop being the distinguishing thing and this can be
  # revisited.
  #
  # The device is deliberately the cheapest one that still walks the
  # whole chain (tests/e2e/project/devices/e2e-node/main.yaml says why): no
  # transport, no Matter, therefore no OpenThread and no CHIP. Four
  # minutes rather than fifteen — and a remote build is ALWAYS a cold
  # one, because this server mounts a shared compiler cache read-only
  # and never a writable one (README, "the cache"), so the cheap device
  # is not a nicety here.
  test-e2e:
    name: Test (end to end)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the build container. It is public, but an authenticated
      # pull does not share the anonymous rate limit.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SDK repository is a west manifest repository and its own CI
      # puts it one level below the workspace top directory for that
      # reason. Nothing here runs west, so a plain sub-directory is fine.
      - name: Checkout mcuhome-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout mcuhome-workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      - name: Checkout mcuhome-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-cli
          path: .deps/mcuhome-cli

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # In dependency order, which pip does not need and a reader does.
      # `remote` is the extra the session-protocol client lives in
      # (aiohttp + zstandard); zstandard also builds the SDK archive
      # below.
      - name: Install the four distributions
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./.deps/mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-sdk/packaging/compiler \
            -e './.deps/mcuhome-workbench[remote]' \
            -e ./.deps/mcuhome-cli \
            -e .

      # The build container image is several gigabytes and the build
      # tree lands beside it. The preinstalled Android/.NET/Haskell
      # toolchains are worth tens of gigabytes and nothing here uses one.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # Both halves of the SDK pin come from this one archive: the client
      # resolves the version out of it and states the sha256 in the
      # context, and the server resolves the same version out of the same
      # directory and checks the bytes against that pin. Same directory
      # here because there is one machine; on a real deployment they are
      # two, which is the case the pin exists for.
      - name: Build the SDK source archive
        run: |
          python -m pip install --disable-pip-version-check zstandard
          python .deps/mcuhome-sdk/scripts/build_sdk_archive.py --output-dir dist/sdk

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This server pulls nothing, by design: it runs the exact image the
      # context pins and refuses when it does not have it. So the image
      # has to be here first, and the reference comes from the one place
      # that states it — the same constant the SDK repository tags and a
      # client resolves to, so no two parties can disagree about what
      # "the build container" is. The client reaches it through the
      # moving tag; the bytes are the same, which is what makes the pin
      # it writes match what this pull put here.
      - name: Pull the build container
        run: |
          reference="$(python -c '
          from mcuhome.model.buildimage import IMAGE
          print(IMAGE)')"
          echo "::notice::pulling $reference"
          docker pull --quiet "$reference"

      - name: One real remote build
        run: python tests/e2e/run.py --sdk-dir dist/sdk

  license-reuse:
    name: License (reuse)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check reuse==5.0.2

      - name: reuse lint
        run: reuse lint

  spell-codespell:
    name: Spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check codespell==2.4.3

      # The ignored words are deliberate spellings, not slips: Requestor and
      # PASE are the Matter specification's own, OT is OpenThread, rsource is
      # Kconfig's. Generated documents and patches are skipped because their
      # wording is not ours to correct.
      - name: codespell
        run: codespell --ignore-words-list=requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt --skip='./.git,./frontend/node_modules,*.matter,*.zap,pnpm-lock.yaml,*.patch'

  hygiene-prehooks:
    name: Hygiene (pre-commit-hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check pre-commit-hooks==5.0.0

      # The fixers rewrite and exit non-zero when they had to; in CI the tree
      # is throwaway, so that is exactly a check. `patches/` is excluded on
      # purpose: a context line in a unified diff is a single space, and
      # stripping it produces a patch that no longer applies.
      - name: Whitespace, final newline and line endings
        run: |
          text=$(git grep -Il '' -- . ':!patches/**' ':!*.patch' ':!*.matter' ':!*.zap')
          trailing-whitespace-fixer $text
          end-of-file-fixer $text
          mixed-line-ending --fix=no $text

      - name: No merge markers
        run: check-merge-conflict $(git grep -Il '' -- .)

      # --unsafe checks the syntax and not the tags: this project has its own
      # (`!secret`, `!file`), and a loader that refuses them is not a finding.
      - name: YAML parses
        run: |
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -n "$files" ]; then check-yaml --unsafe $files; fi

  commits-conventional:
    name: Commits (conventional)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check conventional-pre-commit==4.0.0

      # Merge commits carry GitHub's wording, not ours, so they are skipped.
      - name: Every commit message states its kind
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          status=0
          for sha in $(git log --no-merges --format=%H "$range"); do
            git log -1 --format=%B "$sha" > /tmp/commit-message
            conventional-pre-commit /tmp/commit-message || { echo "  ^ $sha"; status=1; }
          done
          exit $status
