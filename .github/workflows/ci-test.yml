#
# Test gate for the build server: one job per wrapper in
# scripts/test.d/ (pytest, e2e), plus a pre-check that every wrapper has
# a job here.
#
# test-pytest checks out two siblings, mcu-home/mcuhome-workbench and
# mcu-home/mcuhome-sdk: pyproject declares mcuhome-workbench, which
# brings mcuhome-model with it, and neither is published yet — so the
# sibling checkouts satisfy the declaration. Plain checkouts, no deploy
# key needed since the repositories went public.
#
# test-e2e is one real remote build: this server as a process, a real
# build environment, `mcuhome device build --build-target remote` against
# it, and a signed image at the end. The unit suite fakes docker —
# correctly, a build server is an orchestrator — and that is exactly why
# three lease-versus-time defects and one address parsed as a URL
# reached a real build before anything noticed. It needs four
# repositories checked out (the command, the workbench, the SDK and this
# server), a built SDK source archive, and the build-environment image
# pulled — all preparation steps that belong to CI, done here before
# scripts/test e2e is called with the archive directory. See
# scripts/test.d/e2e's head comment for what the wrapper itself checks.
#
# All actions are pinned to commit SHAs, not tags.

name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-gates:
    name: Check gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: scripts/test check-ci
        run: scripts/test check-ci

  test-pytest:
    name: Test (pytest)
    needs: check-gates
    runs-on: ubuntu-latest
    # The suite is a four-minute job and starts nothing that waits on the
    # outside world, so anything past twenty minutes is a hang and not a
    # slow runner. It is worth bounding explicitly: a suite that passed
    # every test and then would not exit held a runner for the default
    # six hours once, and a job that fails after twenty minutes says what
    # happened while one that is cancelled by hand says nothing.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pyproject declares mcuhome-workbench, which brings mcuhome-model
      # with it. Neither is published yet — so the sibling checkouts
      # satisfy the declaration, exactly as requirements-dev.txt does on
      # a developer machine. They become unnecessary the day the
      # distributions are published.
      - name: Checkout mcuhome-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout mcuhome-workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      # The workbench imports mcuhome.packagetool; it publishes no
      # distribution of its own, so this sibling checkout satisfies that
      # import the same way mcuhome-sdk and mcuhome-workbench above do.
      - name: Checkout mcuhome-packagetool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-packagetool
          path: .deps/mcuhome-packagetool

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Create .venv and install
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -U pip
          .venv/bin/pip install --disable-pip-version-check ./.deps/mcuhome-sdk/packaging/model
          .venv/bin/pip install --disable-pip-version-check \
            -e ./.deps/mcuhome-packagetool \
            ./.deps/mcuhome-workbench
          .venv/bin/pip install --disable-pip-version-check -e . --group dev

      - name: scripts/test pytest
        run: scripts/test pytest

  # ------------------------------------------------------------------
  # The whole chain, once, for real.
  #
  # Four repositories meet here because a remote build needs all four:
  # the command (mcu-home/mcuhome-cli), the client half of the session protocol
  # and the signing step (mcu-home/mcuhome-workbench), the SDK package and the
  # build environment (mcu-home/mcuhome-sdk), and this server. They are
  # checked out at `main` and this repository at the commit under test —
  # which is deliberate, rather than a shared workflow the other three
  # would call: what is being tested here is building a firmware
  # *through this server*. When the workbench and the compiler grow
  # their own end-to-end job for local builds, this can be revisited.
  #
  # The device is deliberately the cheapest one that still walks the
  # whole chain (tests/e2e/project/devices/e2e-node/main.yaml says why): no
  # transport, no Matter, therefore no OpenThread and no CHIP. Four
  # minutes rather than fifteen — and a remote build is ALWAYS a cold
  # one, because this server mounts a shared compiler cache read-only
  # and never a writable one (README, "the cache"), so the cheap device
  # is not a nicety here.
  test-e2e:
    name: Test (e2e)
    needs: check-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the build environment image. It is public, but an
      # authenticated pull does not share the anonymous rate limit.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SDK repository is a west manifest repository and its own CI
      # puts it one level below the workspace top directory for that
      # reason. Nothing here runs west, so a plain sub-directory is fine.
      - name: Checkout mcuhome-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout mcuhome-workbench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-workbench
          path: .deps/mcuhome-workbench

      # The workbench imports mcuhome.packagetool; it publishes no
      # distribution of its own, so this sibling checkout satisfies that
      # import the same way the other three checkouts above/below do.
      - name: Checkout mcuhome-packagetool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-packagetool
          path: .deps/mcuhome-packagetool

      - name: Checkout mcuhome-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-cli
          path: .deps/mcuhome-cli

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # In dependency order, which pip does not need and a reader does.
      # `remote` is the extra the session-protocol client lives in
      # (aiohttp + zstandard); zstandard also builds the SDK archive
      # below. This is a plain venv, not the dev-tools group: scripts/test
      # e2e needs the four distributions installed, not the lint/test
      # tool pins.
      - name: Install the four distributions
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check \
            -e ./.deps/mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-sdk/packaging/compiler \
            -e ./.deps/mcuhome-packagetool \
            -e './.deps/mcuhome-workbench[remote]' \
            -e ./.deps/mcuhome-cli \
            -e .

      # The build environment image is several gigabytes and the build
      # tree lands beside it. The preinstalled Android/.NET/Haskell
      # toolchains are worth tens of gigabytes and nothing here uses one.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # Both halves of the SDK pin come from this one archive: the client
      # resolves the version out of it and states the sha256 in the
      # context, and the server resolves the same version out of the same
      # directory and checks the bytes against that pin. Same directory
      # here because there is one machine; on a real deployment they are
      # two, which is the case the pin exists for.
      - name: Build the SDK source archive
        run: |
          .venv/bin/pip install --disable-pip-version-check zstandard
          .venv/bin/python .deps/mcuhome-sdk/scripts/build_sdk_archive.py --output-dir dist/sdk

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is not pulled here. This server finds the build
      # environment by the labels of whatever the allowed repository
      # publishes for the package set the context pins, and fetches it
      # itself when the operator allows fetching — which is the default
      # and what this job exercises. Naming a reference here would pull
      # bytes the run may not even choose.

      # Preparation is done: scripts/test e2e itself re-checks the
      # runtime, the client and the archive directory, and then drives
      # tests/e2e/run.py against them.
      - name: scripts/test e2e
        run: scripts/test e2e "$PWD/dist/sdk"
